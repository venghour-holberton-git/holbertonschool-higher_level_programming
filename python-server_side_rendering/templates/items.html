<!DOCTYPE html>
<html>
    <header>
        <title>Items</title>
    </header>
    <body>
        <h1>Items List</h1>
        {% include 'header.html' %}
        {% if items | check_items_len %}
            <p> No items found </p>
        {% endif %}
        <ul>
            {% for item in items %}
                <li> {{ item }}</li>
            {% endfor %}
        </ul>
        {% include 'footer.html' %}
    </body>
</html>
